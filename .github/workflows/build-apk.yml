name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java (JDK 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '21'

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    - name: Create temporary APK signing key
      shell: pwsh
      run: |
        $keystore = Join-Path $env:RUNNER_TEMP "racingcars-build.keystore"
        keytool -genkeypair -v `
          -keystore $keystore `
          -storepass android `
          -alias racingcars `
          -keypass android `
          -keyalg RSA `
          -keysize 2048 `
          -validity 10000 `
          -dname "CN=Racing Cars Controller"
        if ($LASTEXITCODE -ne 0) { throw "Unable to create the APK signing key." }
        "APK_KEYSTORE=$keystore" >> $env:GITHUB_ENV

    - name: Build and Package APK
      shell: pwsh
      run: |
        dotnet publish RacingCarsControllerAndroid/RacingCarsControllerAndroid.csproj `
          -c Release `
          -f net9.0-android `
          -p:AndroidPackageFormats=apk `
          -p:AndroidCreatePackagePerAbi=false `
          -p:AndroidKeyStore=true `
          -p:AndroidSigningKeyStore="$env:APK_KEYSTORE" `
          -p:AndroidSigningKeyAlias=racingcars `
          -p:AndroidSigningKeyPass=android `
          -p:AndroidSigningStorePass=android
        if ($LASTEXITCODE -ne 0) { throw "Android APK build failed." }
        $apks = Get-ChildItem "RacingCarsControllerAndroid/bin/Release" -Filter "*.apk" -Recurse
        if (-not $apks) { throw "The Android build completed without producing an APK." }
        $apks | ForEach-Object { Write-Host "APK: $($_.FullName)" }

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShellCar-Controller-APK
        path: |
          RacingCarsControllerAndroid/bin/Release/**/publish/*.apk
          RacingCarsControllerAndroid/bin/Release/**/*-Signed.apk
          RacingCarsControllerAndroid/bin/Release/**/*.apk
