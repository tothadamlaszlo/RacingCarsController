name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java (JDK 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '21'

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Pin to .NET 9 SDK
      run: dotnet new globaljson --sdk-version 9.0.100 --roll-forward latestFeature --force

    - name: Ensure TargetFramework is net9.0-android
      shell: pwsh
      run: |
        $proj = "RacingCarsControllerAndroid/RacingCarsControllerAndroid.csproj"
        if (Test-Path $proj) {
          (Get-Content $proj) -replace 'net8\.0-android', 'net9.0-android' | Set-Content $proj
        }

    - name: Install Android Workload
      run: dotnet workload install android

    - name: Build and Package APK
      run: |
        dotnet publish RacingCarsControllerAndroid/RacingCarsControllerAndroid.csproj `
          -c Release `
          -f net9.0-android `
          -p:AndroidPackageFormats=apk `
          -p:AndroidKeyStore=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShellCar-Controller-APK
        path: |
          RacingCarsControllerAndroid/bin/Release/**/publish/*.apk
          RacingCarsControllerAndroid/bin/Release/**/*-Signed.apk
          RacingCarsControllerAndroid/bin/Release/**/*.apk
